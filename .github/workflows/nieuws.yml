name: Dagelijks nieuws bijwerken

on:
  schedule:
    - cron: "17 5 * * *"   # elke dag 05:17 UTC (06:17/07:17 NL-tijd)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nieuws
  cancel-in-progress: false

jobs:
  nieuws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Afhankelijkheden installeren
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          pip install beautifulsoup4==4.12.3 pillow==10.4.0

      - name: Nieuws ophalen
        run: node _bron/nieuws/fetch.js

      - name: Site opnieuw bouwen
        run: python3 _bron/build.py

      - name: Wijzigingen publiceren
        run: |
          git config user.name "dfo-nieuws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' _bron/nieuws/nieuws.json assets
          if git diff --cached --quiet; then
            echo "Geen nieuwe berichten."
          else
            git commit -m "Nieuws bijgewerkt $(date -u +%Y-%m-%d)"
            git push
          fi
